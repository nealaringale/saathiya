name: Build Saathiya Android APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "firebase-applet-config.json"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saathiya-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build web app and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build React web app
        run: npm run build

      - name: Package web app into Android assets
        shell: bash
        run: |
          test -f dist/index.html
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -R dist/. app/src/main/assets/
          test -f app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Create the debug signing key
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Saathiya-debug.apk
          sha256sum Saathiya-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saathiya-debug-apk
          path: Saathiya-debug.apk
          if-no-files-found: error
          retention-days: 14
